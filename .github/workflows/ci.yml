name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      # The published result files, so that the freshness tests can compare
      # the committed tables and figures with what they regenerate.
      - run: uv run python -m experiments.fetch_results

      - run: uv run pytest --freshness
