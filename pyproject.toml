[project]
name = "threshold-opt"
version = "0.1.0"
description = "Threshold optimization for binary and multiclass classification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Carlo Lemos", email = "vitaliset@users.noreply.github.com" }]
keywords = [
    "threshold-optimization",
    "threshold",
    "classification",
    "binary",
    "multiclass",
    "cost-sensitive",
    "decision-making",
    "calibration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Lower bounds: numpy>=1.26 for Python 3.11 wheels and the array API
    # changes used by the calibration code; scipy>=1.11 for the numpy 1.26
    # ABI; scikit-learn>=1.6 for sklearn.frozen.FrozenEstimator (used in
    # binary_strategies._CalibratedDefaultThreshold and friends).
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/vitaliset/threshold-opt"
Issues = "https://github.com/vitaliset/threshold-opt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is the library alone: the experiment pipeline and the
# dissertation source stay out of both artifacts. The tests live next to
# the modules and ship in the sdist, not in the wheel.
[tool.hatch.build.targets.sdist]
include = ["src/threshold_opt"]

[tool.hatch.build.targets.wheel]
packages = ["src/threshold_opt"]
exclude = ["*_test.py"]

[tool.pytest.ini_options]
testpaths = ["src", "experiments", "lean/scripts"]
python_files = ["*_test.py"]

[dependency-groups]
experiments = [
    "pandas",
    "pyarrow",          # pandas parquet backend
    "lightgbm",
    "xgboost",
    "catboost",
    "tabpfn",
    "tabicl",           # TabICLv2 tabular foundation model
    "pytabkit",         # RealMLP_TD_Classifier
    "tabm",             # TabM deep tabular model (ICLR 2025)
    "imbalanced-learn", # geometric_mean_score
    "tqdm",
]
dev = [
    "pytest",
    "matplotlib",
    "seaborn",
    "ipykernel>=7.2.0",
    "jinja2",
    "ruff",
    "pre-commit>=4.5.1",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "RUF"]
ignore = [
    "E731",   # lambda assignment fine in research code
    "E741",   # allow short math names (l, I, O)
    # ruff format conflict rules
    "W191", "E111", "E114", "E117",
]

[tool.ruff.lint.per-file-ignores]
"slides/**" = ["E501"]  # HTML templates and help strings of the deck tools
