name = "thresholdopt"
defaultTargets = ["ThresholdOpt", "audit"]

# Pinned to a Mathlib release tag so `lake exe cache get` finds prebuilt
# artifacts and the appendix can cite an exact revision. lean-toolchain must
# match the toolchain that tag requires (leanprover/lean4:v4.33.0).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "ThresholdOpt"

[[lean_exe]]
name = "audit"
root = "Audit.Main"
supportInterpreter = true
