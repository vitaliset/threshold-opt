repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: chktex
        name: chktex
        entry: chktex
        args: [-q, -l, .chktexrc]
        language: system
        files: \.tex$
